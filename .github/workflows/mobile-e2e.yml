name: mobile-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/api/src/**"
      - "packages/api-client/**"
      - "tools/stub-scorer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-e2e.yml"

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E: "1"
      # The emulator reaches the runner's localhost through 10.0.2.2.
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The flows assert the stub's fixture answers (tools/stub-scorer/fixtures.json).
      - name: Start the stub scorer
        working-directory: tools/stub-scorer
        run: |
          nohup node server.js > /tmp/scorer.log 2>&1 &
          for i in $(seq 15); do curl -sf localhost:8000/healthz && break; sleep 1; done

      - run: pnpm install --frozen-lockfile --filter @isitfishy/api... --filter @isitfishy/mobile...

      - name: Start the API
        working-directory: apps/api
        env:
          SCORER_URL: http://127.0.0.1:8000
          # /v1/check does not use the database; Prisma connects lazily.
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: |
          pnpm exec prisma generate
          pnpm build
          nohup node dist/main > /tmp/api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:3000/healthz && break; sleep 2; done

      - name: Build the Android app
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/isitfishy.apk"
          rm -rf app/build ~/.gradle/caches
          df -h /

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install $RUNNER_TEMP/isitfishy.apk
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml

      - name: Server logs
        if: failure()
        run: tail -n 50 /tmp/scorer.log /tmp/api.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
