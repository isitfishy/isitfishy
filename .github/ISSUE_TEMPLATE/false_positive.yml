name: False positive
description: A legitimate link or message was shown as medium or high risk
labels: [accuracy, false-positive]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: The link that was flagged, without its query string (the part after ?)
      placeholder: https://www.example.com/path
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Result shown
      options:
        - High risk
        - Medium risk
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is legitimate
      description: Who runs the site, and where you got the link (official app, website, letter)
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message (optional)
      description: >
        If you checked a message, its text with names, phone numbers and codes replaced by
        placeholders.
  - type: input
    id: version
    attributes:
      label: App version
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed personal details from the link and the message
          required: true
