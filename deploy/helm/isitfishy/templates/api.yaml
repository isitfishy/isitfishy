apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "isitfishy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      {{- include "isitfishy.podSecurity" . | nindent 6 }}
        runAsUser: 1000
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "isitfishy.containerSecurity" . | nindent 10 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.passwordSecret }}, key: password } }
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}"
            - { name: SCORER_URL, value: "http://scorer:8000" }
            - { name: SCORER_TIMEOUT_MS, value: {{ .Values.api.scorerTimeoutMs | quote }} }
            - { name: PORT, value: "3000" }
            {{- with .Values.admin.tokenSecret }}
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ . }}, key: token, optional: true } }
            {{- end }}
          ports: [{ containerPort: 3000 }]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          # Database migrations run before the server starts.
          startupProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 3000 }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 3000 } } }
{{- end }}
