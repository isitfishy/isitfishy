apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "isitfishy.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      {{- include "isitfishy.podSecurity" . | nindent 6 }}
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "isitfishy.containerSecurity" . | nindent 10 }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.passwordSecret }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          # Crash recovery after an unclean stop can take a while.
          startupProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user }}] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user }}] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user }}] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
