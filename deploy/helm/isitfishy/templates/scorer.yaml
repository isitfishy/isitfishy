{{- $scorer := .Values.scorer }}
{{- $persistence := $scorer.persistence }}
{{- if $persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $persistence.claimName }}
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ $persistence.size }} } }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorer
  labels: {{- include "isitfishy.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A ReadWriteOnce volume cannot be shared by an old and a new pod.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: scorer }
  template:
    metadata:
      labels: { app: scorer }
    spec:
      {{- include "isitfishy.podSecurity" . | nindent 6 }}
        runAsUser: {{ $scorer.runAsUser }}
        fsGroup: {{ $scorer.fsGroup }}
      {{- with $scorer.initContainers }}
      initContainers: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: scorer
          image: {{ include "isitfishy.scorerImage" . }}
          imagePullPolicy: {{ $scorer.image.pullPolicy }}
          {{- include "isitfishy.containerSecurity" . | nindent 10 }}
          {{- with $scorer.env }}
          env: {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- if or $scorer.envFrom $scorer.existingSecret }}
          envFrom:
            {{- with $scorer.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $scorer.existingSecret }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          {{- end }}
          ports: [{ containerPort: {{ $scorer.port }} }]
          resources: {{- toYaml $scorer.resources | nindent 12 }}
          # Give the scorer generous time to become ready.
          startupProbe:
            httpGet: { path: /healthz, port: {{ $scorer.port }} }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: {{ $scorer.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $scorer.port }} }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- if or $persistence.enabled $scorer.extraVolumeMounts }}
          volumeMounts:
            {{- if $persistence.enabled }}
            - { name: {{ $persistence.volumeName }}, mountPath: {{ $persistence.mountPath }} }
            {{- end }}
            {{- with $scorer.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $persistence.enabled $scorer.extraVolumes }}
      volumes:
        {{- if $persistence.enabled }}
        - name: {{ $persistence.volumeName }}
          persistentVolumeClaim: { claimName: {{ $persistence.claimName }} }
        {{- end }}
        {{- with $scorer.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: scorer
spec:
  selector: { app: scorer }
  ports: [{ port: 8000, targetPort: {{ $scorer.port }} }]
